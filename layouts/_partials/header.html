<header>
    <h1>{{ .Site.Title }}</h1>

        <a href="https://github.com/mfutselaar" aria-label="GitHub" title="My GitHub repository. To be honest, there is not much to find here as I don't really work for or on opensource projects and for personal things I have my self-hosted Gitea repository. The source of this website is available on here though!" class="mdi github"></a>
