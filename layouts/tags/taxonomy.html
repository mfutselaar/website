{{ define "main" }}
<section class="content blog">
    <div class="text-block">
        <h2>Blog - Tags</h2>
        <ul class="bullet-list">
            {{ range .Data.Terms.Alphabetical }}
                <li><a href="{{ .Page.RelPermalink }}">{{ partial "tag-label.html" .Term }}</a> ({{ .Count }})</li>
            {{ end }}
        </ul>
    </div>
</section>
{{ end }}
